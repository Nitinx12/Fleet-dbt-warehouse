rules:
  - reason: CSS declaration or media query
    kinds: [css]
  - reason: SVG geometry and marker path
    pattern: 'viewBox=|class="e|marker|animateMotion|<svg|<path|stroke-dasharray|transform'
  - reason: ARIA and tabindex value
    pattern: 'tabindex=|aria-'
  - reason: local UI port
    pattern: 'localhost:8080'
  - reason: copyright year
    pattern: '© 2026'
  - reason: replay speed control
    pattern: 'data-sp=|×'
  - reason: asset names, CSS classes and inline styles
    kinds: [attr]
    pattern: 'charset|viewport|initial-scale|github.com/Nitinx12|logo_1|box2|style=|tabindex|w3.org|aria-'
  - reason: report filename prefixes
    kinds: [attr]
    pattern: 'reports/(findings|img)/\d\d_'
  - reason: topic and SCD version names
    pattern: 'delivery_events\.v\d|SCD\d'
  - reason: ISO time slice indexes
    kinds: [js]
    pattern: '\.slice\(11, 19\)'
  - reason: JavaScript presentation constants not sourced from facts
    kinds: [js]
    pattern: '^(?!.*FACTS\[).*$'
