[project]
name = "fleet-dbt-warehouse"
version = "0.1.0"
description = "Daily fleet pipeline: MySQL/MongoDB -> Postgres bronze -> dbt -> Databricks marts"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "databricks-sql-connector[pyarrow]>=4.6",
    "dbt-core>=1.12.7",
    "dbt-postgres>=1.11.0",
    "psycopg2-binary>=2.9",
    "pymongo>=4.18",
    "pymysql>=1.2.4",
    "python-dotenv>=1.2",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "pandas>=3.1.1",
    "pytest>=9.0",
    "ruff>=0.16",
    "seaborn>=0.13.2",
]
kafka = [
    "confluent-kafka==2.16.2",
    "psycopg2-binary>=2.9",
    "pymongo>=4.18",
    "pymysql>=1.2.4",
    "pyyaml==6.0.4",
]
spark = [
    "pyspark==4.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.per-file-ignores]
"reports/scripts/[0-9][0-9]_*.py" = ["N999"]
"kafka/**/*.py" = ["TID251"]
"airflow/helpers/scripts/stream_health.py" = ["TID251"]
"scripts/stream_*.py" = ["TID251"]
"scripts/check_contracts.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fleet_stream" = { msg = "streaming code must live under kafka/" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".streamlit"]
markers = [
    "unit: fast, isolated, no I/O",
    "integration: needs a real service",
    "contract: contract drift checks",
    "smoke: fast post-build or post-deploy liveness checks",
    "smoke_prod: read-only checks against production",
]
