name: fleet_dbt
version: "1.0.0"
config-version: 2
profile: fleet_dbt

models:
  fleet_dbt:
    silver:
      +schema: silver
      +materialized: table
      +contract:
          enforced: true
    gold:
      +schema: gold
      +materialized: table
      +contract:
          enforced: true
    marts:
      +schema: marts
      +materialized: table
      +contract:
          enforced: true

vars:
  silver_lookback_hours: 24
  gold_date_start: '2015-01-01'    # dim_date range; must cover your data
  gold_date_end: '2035-12-31'
  gold_lookback_hours: 3
