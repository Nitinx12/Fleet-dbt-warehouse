      - name: cancelled_loads
        description: "Loads with Cancelled status."
        data_type: bigint
      - name: delivered_loads
        description: "Loads with Completed or Delivered status."
        data_type: bigint
      - name: weight_lbs
        description: "Sum of load weight in pounds."
        data_type: bigint
      - name: pieces
        description: "Sum of pieces across loads."
        data_type: bigint
      - name: revenue
        description: "Sum of load revenue bucketed by load month."
        data_type: numeric
        tests: [non_negative]
      - name: fuel_surcharge
        description: "Sum of fuel surcharges across loads."
        data_type: numeric
      - name: accessorial_charges
        description: "Sum of accessorial charges across loads."
        data_type: numeric
      - name: total_charges
        description: "Sum of total charges where every component is known."
        data_type: numeric
      - name: revenue_excl_cancelled
        description: "Sum of revenue on loads that are not cancelled."
        data_type: numeric
      - name: trips_count
        description: "Number of trips dispatched in the month."
        data_type: bigint
      - name: distance_miles
        description: "Sum of actual trip distance in miles."
        data_type: bigint
      - name: duration_hours
        description: "Sum of actual trip duration in hours."
        data_type: numeric
      - name: idle_hours
        description: "Sum of engine idle hours across trips."
        data_type: numeric
      - name: delivery_events_count
        description: "Number of delivery events scheduled in the month."
        data_type: bigint
      - name: on_time_events
        description: "Events with a known TRUE on-time flag."
        data_type: bigint
      - name: late_events
        description: "Events with a known FALSE on-time flag."
        data_type: bigint
      - name: on_time_known_events
        description: "Events where on_time_flag is known; denominator for on_time_rate."
        data_type: bigint
      - name: delay_minutes_sum
        description: "Sum of signed delay minutes; numerator for avg_delay_minutes."
        data_type: numeric
      - name: delay_minutes_count
        description: "Number of known delay values; denominator for avg_delay_minutes."
        data_type: bigint
      - name: detention_events
        description: "Events that recorded detention."
        data_type: bigint
      - name: detention_minutes
        description: "Sum of detention minutes."
        data_type: numeric
      - name: detention_hours
        description: "Sum of detention hours."
        data_type: numeric
      - name: on_time_rate
        description: "Non-additive. SUM(on_time_events) / SUM(on_time_known_events) when rolling up."
        data_type: numeric
      - name: cancellation_rate
        description: "Non-additive. SUM(cancelled_loads) / SUM(loads_count) when rolling up."
        data_type: numeric
      - name: detention_rate
        description: "Non-additive. SUM(detention_events) / SUM(delivery_events_count) when rolling up."
        data_type: numeric
      - name: avg_revenue_per_load
        description: "Non-additive. SUM(revenue) / SUM(loads_count) when rolling up."
        data_type: numeric
      - name: avg_delay_minutes
        description: "Non-additive. SUM(delay_minutes_sum) / SUM(delay_minutes_count) when rolling up."
        data_type: numeric
      - name: revenue_per_trip_mile
        description: "Non-additive monthly indicator; revenue is bucketed by load month and miles by dispatch month."
        data_type: numeric
      - name: source_gold_loaded_at
        description: "Latest gold_loaded_at across the three source facts for the row. Incremental watermark."
        data_type: timestamp with time zone
      - name: dim_hash
        description: "Fingerprint of the denormalised customer attributes."
        data_type: text
      - name: mart_loaded_at
        description: "UTC timestamp when this mart row was built."
        data_type: timestamp with time zone

