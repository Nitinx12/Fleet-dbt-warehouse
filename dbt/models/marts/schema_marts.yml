  - name: assert_marts_reconcile_to_facts
    description: >
      Reconciliation output: one row per mart measure that does not add back to its source fact.
      Returns no rows when every check passes.
    meta: {owner: data-engineering, tier: gold, serve: false, contains_pii: false}
    columns:
      - name: check_name
        description: "Identifier of the mart measure check that failed."
        data_type: text
      - name: fact_value
        description: "Additive measure computed from the source fact model."
        data_type: numeric
      - name: mart_value
        description: "Additive measure computed from the mart model."
        data_type: numeric
      - name: difference
        description: "fact_value minus mart_value; non-zero rows are the failures."
        data_type: numeric

unit_tests:
  - name: test_assert_marts_reconcile_to_facts_flags_revenue_drift
    model: assert_marts_reconcile_to_facts
    given:
      - input: ref('fct_loads')
        format: sql
        rows: |
          select 100::numeric as revenue
      - input: ref('mart_sales_daily')
        format: sql
        rows: |
          select 1::bigint as loads_count, 90::numeric as revenue
      - input: ref('mart_customer_service_monthly')
        format: sql
        rows: |
          select 1::bigint as loads_count, 100::numeric as revenue
      - input: ref('fct_trips')
        format: sql
        rows: |
          select 250::integer as actual_distance_miles
      - input: ref('mart_equipment_utilization_daily')
        format: sql
        rows: |
          select 1::bigint as trips_count, 250::bigint as distance_miles
      - input: ref('mart_driver_scorecard_monthly')
        format: sql
        rows: |
          select 1::bigint as trips_count, 1::bigint as incidents_count, 40::numeric as fuel_cost
      - input: ref('fct_delivery_events')
        format: sql
        rows: |
          select 15::numeric as detention_minutes
      - input: ref('mart_delivery_performance_daily')
        format: sql
        rows: |
          select 1::bigint as events_count, 15::numeric as detention_minutes
      - input: ref('fct_safety_incidents')
        format: sql
        rows: |
          select 'INC1'::text as incident_id
      - input: ref('fct_fuel_purchases')
        format: sql
        rows: |
          select 40::numeric as total_cost
      - input: ref('fct_maintenance')
        format: sql
        rows: |
          select 60::numeric as total_cost
      - input: ref('mart_truck_cost_monthly')
        format: sql
        rows: |
          select 40::numeric as fuel_cost, 60::numeric as maintenance_cost
    expect:
      format: sql
      rows: |
        select 'mart_sales_daily.revenue'::text as check_name,
               100::numeric as fact_value,
               90::numeric as mart_value,
               10::numeric as difference
